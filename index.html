<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balatro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>

/* ── Reset & base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green-felt:   #1b5e38;
  --felt-dark:    #143d27;
  --felt-light:   #236b43;
  --gold:         #f5c842;
  --gold-dark:    #c99b1a;
  --red:          #cc2200;
  --card-bg:      #fdf6e3;
  --card-border:  #222;
  --pixel:        'Press Start 2P', monospace;
  --shadow-hard:  4px 4px 0 #000;
}

body {
  background: var(--green-felt);
  /* pixel felt texture */
  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px,
      transparent 1px, transparent 4px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 1px,
      transparent 1px, transparent 4px
    );
  min-height: 100vh;
  overflow: hidden;
  font-family: var(--pixel);
  color: #fff;
  image-rendering: pixelated;
}

/* ── Layout ───────────────────────────────────────────────── */

#hud {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  background: var(--felt-dark);
  border-bottom: 3px solid #000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
}

#score-display {
  font-size: 0.7rem;
  color: var(--gold);
  text-shadow: var(--shadow-hard);
  letter-spacing: 1px;
}

#blind-status {
  font-size: 0.5rem;
  color: #a8d5b5;
  text-align: center;
}

/* Progress bar */
#progress-wrap {
  position: fixed;
  top: 64px; left: 0; right: 0;
  height: 8px;
  background: #0a2a18;
  border-bottom: 2px solid #000;
  z-index: 100;
}
#progress-bar-fill {
  height: 100%;
  background: var(--gold);
  transition: width 0.4s ease;
  box-shadow: 0 0 8px rgba(245,200,66,0.6);
}

/* ── Hand area ────────────────────────────────────────────── */

#hand-area {
  position: fixed;
  bottom: 80px; left: 0; right: 0;
  height: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  background: rgba(0,0,0,0.15);
  border-top: 3px solid rgba(0,0,0,0.3);
  overflow: visible;
}

/* ── Controls ─────────────────────────────────────────────── */

#controls {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: var(--felt-dark);
  border-top: 3px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 100;
}

button {
  font-family: var(--pixel);
  font-size: 0.45rem;
  padding: 10px 14px;
  border: 3px solid #000;
  cursor: pointer;
  box-shadow: var(--shadow-hard);
  transition: transform 0.08s, box-shadow 0.08s;
  image-rendering: pixelated;
  letter-spacing: 0.5px;
}
button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }
button:disabled { opacity: 0.4; cursor: not-allowed; }

#play-btn    { background: #2563eb; color: #fff; }
#discard-btn { background: var(--red); color: #fff; }
#reset-btn   { background: #555; color: #ccc; }

/* ── Sidebar info ─────────────────────────────────────────── */

#sidebar {
  position: fixed;
  top: 80px; right: 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  z-index: 200;
}

#hand-type-preview {
  font-size: 0.55rem;
  color: var(--gold);
  text-shadow: var(--shadow-hard);
  text-align: right;
  max-width: 180px;
}
#hand-type-preview.preview-idle { color: #7aad90; }
#hand-type-preview.preview-active { color: var(--gold); }

#hand-validation-msg {
  font-size: 0.45rem;
  color: #ff6666;
  text-align: right;
  min-height: 1em;
}

/* ── Deck counter ─────────────────────────────────────────── */

#deck-area {
  position: fixed;
  top: 80px; left: 12px;
  background: var(--felt-dark);
  border: 3px solid #000;
  box-shadow: var(--shadow-hard);
  padding: 8px 12px;
  font-size: 0.45rem;
  color: #a8d5b5;
  z-index: 200;
}

/* ── Cards ────────────────────────────────────────────────── */

.card {
  position: relative;
  width: 80px;
  height: 120px;
  background: var(--card-bg);
  border: 3px solid var(--card-border);
  border-radius: 4px;
  box-shadow: var(--shadow-hard);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  flex-shrink: 0;
  image-rendering: pixelated;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 4px 10px 0 #000;
}

.card.selected {
  transform: translateY(-24px) !important;
  box-shadow: 0 0 0 3px #4ade80, 4px 4px 0 #000 !important;
  background: #f0ffe8;
}

.card-corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  font-family: var(--pixel);
}
.card-corner.top-left    { top: 5px;  left: 5px; }
.card-corner.bottom-right { bottom: 5px; right: 5px; transform: rotate(180deg); }

.card-rank { font-size: 0.5rem; color: #111; font-weight: bold; }
.card-suit { font-size: 0.55rem; }
.card-suit.red { color: var(--red); }

.card-center {
  font-size: 2rem;
  pointer-events: none;
  line-height: 1;
}
.card-center.red { color: var(--red); }

/* ── Physics toggle ───────────────────────────────────────── */

#mode-toggle-label {
  position: fixed;
  top: 74px; left: 12px;
  font-size: 0.35rem;
  color: #7aad90;
  cursor: pointer;
  z-index: 300;
  display: none; /* hidden until sidebar shows deck */
}

/* ── Popup ────────────────────────────────────────────────── */

.popup {
  position: fixed;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 2000;
}
.popup-headline {
  font-family: var(--pixel);
  font-size: 1.6rem;
  text-shadow: 4px 4px 0 #000;
  line-height: 1.2;
}
.popup-sub {
  font-family: var(--pixel);
  font-size: 0.7rem;
  color: #fff;
  text-shadow: 2px 2px 0 #000;
  margin-top: 8px;
}

</style>
</head>
<body>

<!-- HUD bar -->
<div id="hud">
  <div id="score-display">Score: 0</div>
  <div id="blind-status">Small Blind — Target: 100</div>
  <label style="font-size:0.38rem; color:#7aad90; cursor:pointer;">
    <input type="checkbox" id="mode-toggle"> Wiggle
  </label>
</div>

<!-- Progress bar -->
<div id="progress-wrap">
  <div id="progress-bar-fill" style="width:0%"></div>
</div>

<!-- Deck counter -->
<div id="deck-area">DECK: <span id="deck-count">52</span></div>

<!-- Sidebar preview -->
<div id="sidebar">
  <div id="hand-validation-msg"></div>
  <div id="hand-type-preview" class="preview-idle">Select cards to play...</div>
</div>

<!-- Hand -->
<div id="hand-area"></div>

<!-- Controls -->
<div id="controls">
  <button id="play-btn">▶ Play Hand (4 left)</button>
  <button id="discard-btn">✕ Discard (4 left)</button>
  <button id="reset-btn">↺ Reset</button>
</div>

<script type="module" src="ui.js"></script>
</body>
</html>
