<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balatro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/deckArea.css">
<link rel="stylesheet" href="css/gameContainer.css">
<link rel="stylesheet" href="css/handArea.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/moneyLabel.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/physicsToggle.css">
<link rel="stylesheet" href="css/popup.css">
<link rel="stylesheet" href="css/progressBar.css">
<link rel="stylesheet" href="css/sidebar.css">

</head>
<body>


  <div id="game-container">

    <!--Deck selection overlay -->
<div id="deck-select-overlay" class="overlay">
    <h1>Select Deck</h1>
    <div id="deck-options-container" style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
        </div>
</div>

<!-- HUD bar -->
<div id="hud">
<div id="scoring-area" style="display: flex; gap: 20px; font-family: 'Press Start 2P'; font-size: 0.8rem; margin-top: 10px;">
  <div id="chips-display" style="color: #60a5fa; text-shadow: 2px 2px 0 #000;">Chips: 0</div>
  <div id="x-display" style="color: #ffffff; text-shadow: 2px 2px 0 #000;">X</div>
  <div id="mult-display" style="color: #ef4444; text-shadow: 2px 2px 0 #000;">Mult: 0</div>
</div>
  <div id="money-display" style="color: var(--gold); font-size: 0.8 rem; text-shadow: var(--shadow-hard);">$0</div>
  <div id="score-display">Score: 0</div>
  <div id="blind-status">Small Blind — Target: 100</div>
  <label style="font-size:0.38rem; color:#7aad90; cursor:pointer;">
    <input type="checkbox" id="mode-toggle"> Wiggle
  </label>
</div>

<!-- Progress bar -->
<div id="progress-wrap">
  <div id="progress-bar-fill" style="width:0%"></div>
</div>

<div id="joker-area" style="
  position: fixed; 
  bottom: 270px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 50;
  min-height: 100px;
">
  </div>

<!-- Deck counter -->
<div id="deck-area">DECK: <span id="deck-count">52</span></div>

<div id="discard-pile" style="
  position: fixed;
  top: 140px; left: 12px;
  background: var(--felt-dark);
  border: 3px solid #000;
  box-shadow: var(--shadow-hard);
  padding: 8px 12px;
  font-size: 0.45rem;
  color: #ff6666; /* Reddish to distinguish from deck */
  z-index: 200;
  cursor: pointer;
">
DISCARD: <span id="discard-count">0</span>
</div>

<!-- Sidebar preview -->
<div id="sidebar">
  <div id="hand-validation-msg"></div>
  <div id="hand-type-preview" class="preview-idle">Select cards to play...</div>
</div>

<!-- Hand -->
<div id="hand-area"></div>

<!-- Controls -->
<div id="controls">
  <button id="play-btn">▶ Play Hand (4 left)</button>
  <button id="discard-btn">✕ Discard (4 left)</button>
  <button id="reset-btn">↺ Reset</button>
  <button id="adv-round-btn">Adv Round</button>
</div>

  </div>


<script type="module" src="ui.js"></script>
</body>
</html>
